---
{{ if .Values.webapp.ingress.enabled -}}
{{- $fullName := include "airbyte.fullname" . -}}
{{- $svcPort := .Values.webapp.service.port -}}
{{- if and .Values.webapp.ingress.className (not (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion)) }}
  {{- if not (hasKey .Values.webapp.ingress.annotations "kubernetes.io/ingress.class") }}
  {{- $_ := set .Values.webapp.ingress.annotations "kubernetes.io/ingress.class" .Values.webapp.ingress.className}}
  {{- end }}
{{- end }}
{{- if semverCompare ">=1.19-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1
{{- else if semverCompare ">=1.14-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1beta1
{{- else -}}
apiVersion: extensions/v1beta1
{{- end }}
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "airbyte.labels" . | nindent 4 }}
  {{- with .Values.webapp.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if and .Values.webapp.ingress.className (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion) }}
  ingressClassName: {{ .Values.webapp.ingress.className }}
  {{- end }}
  {{- if .Values.webapp.ingress.tls }}
  tls:
    {{- range .Values.webapp.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- $serverPort := int (.Values.server.service.port | default 8001) -}}
    {{- $connectorBuilderPath := trimSuffix "/" ((index .Values.webapp "connectorBuilderServer" | default dict).url | default "") -}}
    {{- $connectorBuilderPort := int (.Values.connectorBuilderServer.service.port | default 80) -}}
    {{- range .Values.webapp.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          # Route /api to the Airbyte server so API requests (e.g. create pipeline) reach the backend
          - path: /api
            {{- if semverCompare ">=1.18-0" $.Capabilities.KubeVersion.GitVersion }}
            pathType: Prefix
            {{- end }}
            backend:
              {{- if semverCompare ">=1.19-0" $.Capabilities.KubeVersion.GitVersion }}
              service:
                name: {{ $.Release.Name }}-airbyte-server-svc
                port:
                  number: {{ $serverPort }}
              {{- else }}
              serviceName: {{ $.Release.Name }}-airbyte-server-svc
              servicePort: {{ $serverPort }}
              {{- end }}
          {{- if $connectorBuilderPath }}
          # Route connector-builder path to connector-builder-server when webapp.connectorBuilderServer.url is set
          - path: {{ $connectorBuilderPath }}
            {{- if semverCompare ">=1.18-0" $.Capabilities.KubeVersion.GitVersion }}
            pathType: Prefix
            {{- end }}
            backend:
              {{- if semverCompare ">=1.19-0" $.Capabilities.KubeVersion.GitVersion }}
              service:
                name: {{ $.Release.Name }}-airbyte-connector-builder-server-svc
                port:
                  number: {{ $connectorBuilderPort }}
              {{- else }}
              serviceName: {{ $.Release.Name }}-airbyte-connector-builder-server-svc
              servicePort: {{ $connectorBuilderPort }}
              {{- end }}
          {{- end }}
          {{- range .paths }}
          - path: {{ .path }}
            {{- if semverCompare ">=1.18-0" $.Capabilities.KubeVersion.GitVersion }}
            {{- /* Default ImplementationSpecific to  */}}
            pathType: {{ .pathType | default "ImplementationSpecific" }}
            {{- end }}
            backend:
              {{- if semverCompare ">=1.19-0" $.Capabilities.KubeVersion.GitVersion }}
              service:
                name: {{ $.Release.Name }}-airbyte-webapp-svc
                port:
                  number: {{ $svcPort }}
              {{- else }}
              serviceName: {{ $fullName }}-svc
              servicePort: {{ $svcPort }}
              {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
