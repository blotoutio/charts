{{- if .Values.webapp.ingress.enabled }}

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "airbyte.fullname" . }}
  labels:
    {{- include "airbyte.labels" . | nindent 4 }}
  {{- with .Values.webapp.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}

spec:
  {{- if .Values.webapp.ingress.className }}
  ingressClassName: {{ .Values.webapp.ingress.className }}
  {{- end }}

  {{- if .Values.webapp.ingress.tls }}
  tls:
  {{- range .Values.webapp.ingress.tls }}
    - hosts:
      {{- range .hosts }}
        - {{ . | quote }}
      {{- end }}
      secretName: {{ .secretName }}
  {{- end }}
  {{- end }}
  rules:
  {{- range .Values.webapp.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:

        - path: /api
          pathType: Prefix
          backend:
            service:
              name: {{ $.Release.Name }}-workload-api-server-svc
              port:
                number: {{ $.Values.workloadApiServer.service.port | default 8001 }}
        - path: /auth
          pathType: Prefix
          backend:
            service:
              name: {{ $.Release.Name }}-workload-api-server-svc
              port:
                number: {{ $.Values.workloadApiServer.service.port | default 8001 }}
        - path: /connector-builder-api
          pathType: Prefix
          backend:
            service:
              name: {{ $.Release.Name }}-airbyte-connector-builder-server-svc
              port:
                number: {{ $.Values.connectorBuilderServer.service.port | default 80 }}
        - path: /
          pathType: Prefix
          backend:
            service:
              name: {{ $.Release.Name }}-airbyte-webapp-svc
              port:
                number: {{ $.Values.webapp.service.port }}

  {{- end }}

{{- end }}