{{- if or (eq .Values.global.edition "community") (eq .Values.global.edition "cloud") (eq .Values.global.edition "enterprise") }}
{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "airbyte.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "airbyte.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "-10"
  {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "airbyte.serviceAccountName" . }}-role
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "airbyte.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "-5"
rules:
  - apiGroups: [""]
    resources: ["jobs", "pods", "pods/log", "pods/exec", "pods/attach", "pods/status", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "airbyte.serviceAccountName" . }}-binding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "airbyte.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "-3"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "airbyte.serviceAccountName" . }}-role
subjects:
  - kind: ServiceAccount
    name: {{ include "airbyte.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# Pod launcher Role: allows the job-pod service account to create/manage pods (sync, check, etc.)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: airbyte-pod-launcher
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "airbyte.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/exec
      - pods/status
    verbs:
      - create
      - get
      - list
      - watch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airbyte-pod-launcher-binding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "airbyte.labels" . | nindent 4 }}
roleRef:
  kind: Role
  name: airbyte-pod-launcher
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: ServiceAccount
    name: {{ include "airbyte.jobPodServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
