# Default values for backend-sdk.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: blotout/sdk-backend
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "0.23.0"

env: {}

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

# Start a new pod and wait for it to be Ready before stopping an old one,
# so a rollout never leaves the SDK with fewer ready pods.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# On shutdown, keep serving while Envoy / the load balancer stop routing to the
# pod, then let in-flight requests finish. Must stay below the grace period.
preStopSleepSeconds: 15
terminationGracePeriodSeconds: 45

# Keep at least one SDK pod during node drains and autoscaler scale-down.
# Run at least 2 replicas (autoscaling.minReplicas: 2) when this is enabled,
# otherwise a single pod can never be evicted and node drains hang.
podDisruptionBudget:
  enabled: true
  minAvailable: 1

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

readinessProbe:
  httpGet:
    path: 
    port: 8080
  failureThreshold: 2
  initialDelaySeconds: 30
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 5
livenessProbe:
  httpGet:
    path: 
    port: 8080
  failureThreshold: 2
  initialDelaySeconds: 60
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 5


autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 50
  targetMemoryUtilizationPercentage: 50

nodeSelector: {}

tolerations: []

affinity: {}

# PriorityClass for SDK pods (cluster-scoped, created outside this chart).
# Under node pressure the kubelet evicts lower-priority pods (ETL) first.
priorityClassName: ""

# Spread replicas across nodes (soft: ScheduleAnyway).
spreadAcrossNodes: true
