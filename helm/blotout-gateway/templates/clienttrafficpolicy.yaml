apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: blotout-client-ip
  namespace: {{ .Values.gateway.namespace }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.gateway.name }}
  clientIPDetection:
    customHeader:
      name: CF-Connecting-IP
  # Close idle client connections before the NLB drops them at 350s.
  # streamIdleTimeout is a silent in-flight request. Envoy's default is 5m,
  # which cuts the backend (900s) and MCP (3600s) while they are still working.
  timeout:
    http:
      idleTimeout: 75s
      streamIdleTimeout: 3600s
  # Probes start before the NLB's 350s drop, so a long silent stream stays up.
  tcpKeepalive:
    idleTime: 60s
    interval: 30s
    probes: 3
