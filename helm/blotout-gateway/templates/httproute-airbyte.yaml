{{- if .Values.enableAirbyte }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: airbyte
  namespace: {{ .Values.airbyteNamespace }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: https
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: http
  hostnames:
    - {{ .Values.airbyteHost | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /connector-builder-api
      backendRefs:
        - name: airbyte-v2-airbyte-connector-builder-server-svc
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: airbyte-v2-airbyte-server-svc
          port: 8001
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: airbyte-timeouts
  namespace: {{ .Values.airbyteNamespace }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: airbyte
  timeout:
    http:
      requestTimeout: {{ .Values.timeouts.airbyte | quote }}
      connectionIdleTimeout: {{ .Values.timeouts.airbyte | quote }}
{{- end }}
