apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: blotoutapi
  namespace: default
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: https
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: http
  hostnames:
    - {{ .Values.uiHost | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: PathPrefix
            value: /swagger-ui
        - path:
            type: Exact
            value: /swagger-ui-custom.html
        - path:
            type: PathPrefix
            value: /v3
      backendRefs:
        - name: blotoutapi
          port: 8080
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: blotoutapi-timeouts
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: blotoutapi
  timeout:
    http:
      requestTimeout: {{ .Values.timeouts.backend | quote }}
      connectionIdleTimeout: {{ .Values.timeouts.backend | quote }}
