apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: data-lineage
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: https
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: http
  hostnames:
    - {{ .Values.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /data-lineage
      backendRefs:
        - name: nginx-svc
          port: 80
